<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a reworked orange and charcoal varsity bomber jacket with a chopped sleeve and an elbow patch">
  <defs>
    <pattern id="weave-bomber" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#26292C" stroke-opacity="0.045" stroke-width="1.4"/>
    </pattern>
    <pattern id="halftone-bomber" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="6.5" cy="6.5" r="2.3" fill="#F5821F" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="#F7F5F0"/>
  <rect width="800" height="1000" fill="url(#weave-bomber)"/>
  <g transform="translate(560,40)"><rect width="200" height="200" fill="url(#halftone-bomber)"/></g>

  <!-- jacket body -->
  <g transform="translate(150,190)">
    <path d="M180,0 L360,0 C388,0 412,18 424,44 L500,120 L462,196 L410,158 L410,650 C410,672 392,690 370,690 L110,690 C88,690 70,672 70,650 L70,158 L30,196 L-10,120 L66,44 C78,18 102,0 130,0 Z" fill="#3D4147"/>
    <!-- collar / rib -->
    <path d="M180,0 L360,0 C388,0 412,18 424,44 L438,66 L102,66 L114,44 C126,18 152,0 180,0 Z" fill="#F5821F"/>
    <!-- chest stripe -->
    <rect x="70" y="158" width="340" height="34" fill="#F5821F"/>
    <!-- hem rib -->
    <rect x="70" y="662" width="340" height="28" rx="6" fill="#17A184"/>
    <!-- left sleeve, chopped short -->
    <rect x="-10" y="118" width="46" height="150" rx="12" fill="#17A184"/>
    <rect x="-10" y="118" width="46" height="20" fill="#2DD4A7"/>
    <!-- right sleeve, full length -->
    <rect x="454" y="118" width="46" height="330" rx="12" fill="#17A184"/>
    <rect x="454" y="118" width="46" height="20" fill="#2DD4A7"/>

    <!-- center placket -->
    <line x1="240" y1="66" x2="240" y2="662" stroke="#26292C" stroke-width="3" opacity="0.35"/>
    <circle cx="240" cy="220" r="6" fill="#F0A500"/>
    <circle cx="240" cy="320" r="6" fill="#F0A500"/>
    <circle cx="240" cy="420" r="6" fill="#F0A500"/>
    <circle cx="240" cy="520" r="6" fill="#F0A500"/>

    <!-- chenille chevron patch, right chest -->
    <circle cx="240" cy="270" r="58" fill="#FFB84D"/>
    <circle cx="240" cy="270" r="58" fill="none" stroke="#26292C" stroke-width="3"/>
    <path d="M240,224 L256,258 L292,258 L262,280 L274,314 L240,293 L206,314 L218,280 L188,258 L224,258 Z" fill="#E8720F"/>

    <!-- reworked elbow patch, sleeve seam -->
    <g transform="translate(462,300)">
      <rect x="0" y="0" width="46" height="66" rx="8" fill="#F0A500" opacity="0.9"/>
      <path d="M4,4 L42,4 M4,16 L42,16 M4,28 L42,28 M4,40 L42,40 M4,52 L42,52" stroke="#26292C" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>
    </g>
  </g>

  <!-- signature hangtag corner mark -->
  <g transform="translate(668,880) rotate(10)">
    <path d="M0,0 L44,0 C50,0 54,4 54,10 L54,58 C54,64 50,68 44,68 L14,68 L0,44 Z" fill="#F7F5F0" stroke="#26292C" stroke-width="2.5"/>
    <circle cx="27" cy="14" r="5" fill="#F7F5F0" stroke="#26292C" stroke-width="2.5"/>
    <text x="27" y="46" font-family="'Space Mono', monospace" font-size="12" fill="#F5821F" text-anchor="middle" font-weight="700">TH</text>
  </g>

  <g fill="#26292C" opacity="0.12">
    <circle cx="90" cy="120" r="2"/>
    <circle cx="120" cy="900" r="2"/>
    <circle cx="700" cy="760" r="2"/>
    <circle cx="60" cy="560" r="2"/>
  </g>
</svg>
