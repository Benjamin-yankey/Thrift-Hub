<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a teal boxy t-shirt with a charcoal chest print patch">
  <defs>
    <pattern id="weave-tee" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#26292C" stroke-opacity="0.045" stroke-width="1.4"/>
    </pattern>
    <pattern id="halftone-tee" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="6.5" cy="6.5" r="2.3" fill="#F5821F" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="#F7F5F0"/>
  <rect width="800" height="1000" fill="url(#weave-tee)"/>
  <g transform="translate(600,700)"><rect width="170" height="170" fill="url(#halftone-tee)"/></g>

  <g transform="translate(190,160)">
    <path d="M140,0 L280,0 L340,60 L420,20 L460,110 L380,150 L380,620 L40,620 L40,150 L-40,110 L0,20 L80,60 Z" fill="#17A184"/>
    <path d="M150,4 C170,34 250,34 270,4" fill="none" stroke="#26292C" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <circle cx="210" cy="260" r="70" fill="#26292C"/>
    <text x="210" y="272" font-family="'Space Mono', monospace" font-size="34" fill="#F0A500" text-anchor="middle" font-weight="700">TH</text>
    <line x1="60" y1="600" x2="360" y2="600" stroke="#0D7C68" stroke-width="3" stroke-dasharray="8 7" opacity="0.7"/>
  </g>

  <g transform="translate(660,150) rotate(-10)">
    <path d="M0,0 L44,0 C50,0 54,4 54,10 L54,58 C54,64 50,68 44,68 L14,68 L0,44 Z" fill="#F7F5F0" stroke="#26292C" stroke-width="2.5"/>
    <circle cx="27" cy="14" r="5" fill="#F7F5F0" stroke="#26292C" stroke-width="2.5"/>
    <text x="27" y="46" font-family="'Space Mono', monospace" font-size="12" fill="#17A184" text-anchor="middle" font-weight="700">TH</text>
  </g>

  <g fill="#26292C" opacity="0.12">
    <circle cx="90" cy="900" r="2"/>
    <circle cx="700" cy="500" r="2"/>
    <circle cx="120" cy="200" r="2"/>
