<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of charcoal canvas high-top sneakers with teal laces">
  <defs>
    <pattern id="weave-shoe" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#26292C" stroke-opacity="0.045" stroke-width="1.4"/>
    </pattern>
    <pattern id="halftone-shoe" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="6.5" cy="6.5" r="2.3" fill="#2DD4A7" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="#F7F5F0"/>
  <rect width="800" height="1000" fill="url(#weave-shoe)"/>
  <g transform="translate(60,700)"><rect width="170" height="170" fill="url(#halftone-shoe)"/></g>

  <!-- back shoe -->
  <g transform="translate(120,360) rotate(-4)">
    <path d="M0,180 C10,90 90,40 220,36 C300,32 360,60 400,100 L460,110 C486,114 500,134 490,158 L20,220 C0,224 -4,196 0,180 Z" fill="#3D4147"/>
    <path d="M10,182 L488,158 L490,196 C492,210 480,222 464,222 L36,222 C18,222 6,206 10,182 Z" fill="#26292C"/>
  </g>

  <!-- front shoe, main subject -->
  <g transform="translate(180,520) rotate(-6)">
    <path d="M0,220 C12,110 110,50 270,44 C368,40 440,74 486,122 L562,134 C592,138 610,162 598,190 L24,268 C0,272 -4,240 0,220 Z" fill="#4B5058"/>
    <path d="M10,222 L596,190 L600,236 C603,254 588,268 568,268 L44,268 C22,268 6,248 10,222 Z" fill="#26292C"/>
    <!-- toe cap -->
    <path d="M0,220 C6,150 46,96 110,66 C90,120 84,180 88,236 L20,264 C2,268 -4,240 0,220 Z" fill="#F7F5F0" opacity="0.92"/>
    <!-- rubber sole -->
    <rect x="10" y="258" width="586" height="26" rx="12" fill="#17A184"/>
    <!-- laces -->
    <path d="M150,160 L440,110 M160,182 L432,132 M172,204 L424,154 M186,224 L414,176" stroke="#2DD4A7" stroke-width="7" stroke-linecap="round"/>
    <circle cx="150" cy="160" r="5" fill="#F0A500"/>
    <circle cx="440" cy="110" r="5" fill="#F0A500"/>
    <circle cx="160" cy="182" r="5" fill="#F0A500"/>
    <circle cx="432" cy="132" r="5" fill="#F0A500"/>
    <circle cx="172" cy="204" r="5" fill="#F0A500"/>
    <circle cx="424" cy="154" r="5" fill="#F0A500"/>
    <!-- ankle patch -->
    <circle cx="500" cy="150" r="30" fill="#FFB84D"/>
    <circle cx="500" cy="150" r="30" fill="none" stroke="#26292C" stroke-width="3"/>
    <text x="500" y="157" font-family="'Space Mono', monospace" font-size="13" fill="#26292C" text-anchor="middle" font-weight="700">TH</text>
  </g>

  <g transform="translate(668,120) rotate(8)">
    <path d="M0,0 L44,0 C50,0 54,4 54,10 L54,58 C54,64 50,68 44,68 L14,68 L0,44 Z" fill="#F7F5F0" stroke="#26292C" stroke-width="2.5"/>
    <circle cx="27" cy="14" r="5" fill="#F7F5F0" stroke="#26292C" stroke-width="2.5"/>
    <text x="27" y="46" font-family="'Space Mono', monospace" font-size="12" fill="#2DD4A7" text-anchor="middle" font-weight="700">TH</text>
  </g>

  <g fill="#26292C" opacity="0.12">
    <circle cx="700" cy="880" r="2"/>
    <circle cx="120" cy="200" r="2"/>
    <circle cx="640" cy="300" r="2"/>
  </g>
</svg>
