    <circle cx="140" cy="20" r="4" fill="#26292C"/>
    <circle cx="20" cy="44" r="4" fill="#26292C"/>
    <circle cx="140" cy="44" r="4" fill="#26292C"/>
    <circle cx="20" cy="68" r="4" fill="#26292C"/>
    <circle cx="140" cy="68" r="4" fill="#26292C"/>
