    <path d="M0,140 L0,20 C0,8 10,0 24,0 L140,0 C154,0 164,10 164,24 L164,110 L260,150 C280,158 280,190 258,192 L10,192 C0,192 -6,180 0,166 Z" fill="#4B5058"/>
