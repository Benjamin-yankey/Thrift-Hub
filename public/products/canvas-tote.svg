    <path d="M20,20 L340,20 L370,540 L-10,540 Z" fill="#E9D9B8"/>
    <path d="M20,20 L340,20 L370,540 L-10,540 Z" fill="none" stroke="#3D4147" stroke-width="4" opacity="0.5"/>
    <line x1="20" y1="20" x2="-10" y2="540" stroke="#3D4147" stroke-width="2" stroke-dasharray="6 6" opacity="0.5"/>
    <line x1="340" y1="20" x2="370" y2="540" stroke="#3D4147" stroke-width="2" stroke-dasharray="6 6" opacity="0.5"/>
    <rect x="90" y="180" width="150" height="120" rx="8" fill="#17A184" transform="rotate(-4 165 240)"/>
    <path d="M105,200 L225,200 M105,220 L225,220 M105,240 L225,240 M105,260 L225,260 M105,280 L225,280" stroke="#0D7C68" stroke-width="2" opacity="0.6" transform="rotate(-4 165 240)"/>
  </g>

  <g transform="translate(640,260) rotate(-10)">
