<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a cream canvas tote bag with a teal patch repair">
  <defs>
    <pattern id="weave-tote" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#26292C" stroke-opacity="0.045" stroke-width="1.4"/>
    </pattern>
    <pattern id="halftone-tote" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="6.5" cy="6.5" r="2.3" fill="#17A184" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="#F7F5F0"/>
  <rect width="800" height="1000" fill="url(#weave-tote)"/>
  <g transform="translate(560,650)"><rect width="170" height="170" fill="url(#halftone-tote)"/></g>

  <g transform="translate(220,260)">
    <path d="M60,0 C60,-90 300,-90 300,0" fill="none" stroke="#3D4147" stroke-width="16" stroke-linecap="round"/>
