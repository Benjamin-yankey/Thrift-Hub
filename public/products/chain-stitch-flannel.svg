<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a charcoal and orange plaid flannel overshirt with hand chain-stitched cuffs">
  <defs>
    <pattern id="weave-flannel" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#26292C" stroke-opacity="0.045" stroke-width="1.4"/>
    </pattern>
    <pattern id="plaid" width="46" height="46" patternUnits="userSpaceOnUse">
      <rect width="46" height="46" fill="#E8720F"/>
      <rect width="46" height="10" fill="#3D4147" opacity="0.85"/>
      <rect width="10" height="46" fill="#3D4147" opacity="0.85"/>
      <rect y="24" width="46" height="3" fill="#F0A500" opacity="0.8"/>
      <rect x="24" width="3" height="46" fill="#F0A500" opacity="0.8"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="#F7F5F0"/>
  <rect width="800" height="1000" fill="url(#weave-flannel)"/>

  <g transform="translate(150,180)">
    <path d="M180,0 L360,0 C388,0 412,18 424,44 L500,120 L462,196 L410,158 L410,650 C410,672 392,690 370,690 L110,690 C88,690 70,672 70,650 L70,158 L30,196 L-10,120 L66,44 C78,18 102,0 130,0 Z" fill="url(#plaid)"/>
    <path d="M180,0 L360,0 C388,0 412,18 424,44 L438,66 L102,66 L114,44 C126,18 152,0 180,0 Z" fill="#3D4147"/>
    <line x1="240" y1="66" x2="240" y2="662" stroke="#26292C" stroke-width="3" opacity="0.4"/>
    <circle cx="240" cy="180" r="6" fill="#F7F5F0" stroke="#26292C" stroke-width="2"/>
    <circle cx="240" cy="280" r="6" fill="#F7F5F0" stroke="#26292C" stroke-width="2"/>
    <circle cx="240" cy="380" r="6" fill="#F7F5F0" stroke="#26292C" stroke-width="2"/>
    <circle cx="240" cy="480" r="6" fill="#F7F5F0" stroke="#26292C" stroke-width="2"/>
    <circle cx="240" cy="580" r="6" fill="#F7F5F0" stroke="#26292C" stroke-width="2"/>
    <!-- chest pockets -->
    <rect x="105" y="180" width="70" height="80" fill="none" stroke="#3D4147" stroke-width="4"/>
    <rect x="305" y="180" width="70" height="80" fill="none" stroke="#3D4147" stroke-width="4"/>
    <!-- sleeves -->
    <rect x="-10" y="118" width="46" height="330" rx="12" fill="#3D4147"/>
    <rect x="454" y="118" width="46" height="330" rx="12" fill="#3D4147"/>
    <!-- chain-stitch cuff detail, hand embroidered -->
    <g transform="translate(-2,410)">
      <path d="M4,0 Q14,10 4,20 Q-6,30 4,40" fill="none" stroke="#F0A500" stroke-width="4" stroke-linecap="round"/>
      <path d="M20,0 Q30,10 20,20 Q10,30 20,40" fill="none" stroke="#F0A500" stroke-width="4" stroke-linecap="round"/>
      <path d="M36,0 Q46,10 36,20 Q26,30 36,40" fill="none" stroke="#F0A500" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(458,410)">
      <path d="M4,0 Q14,10 4,20 Q-6,30 4,40" fill="none" stroke="#F0A500" stroke-width="4" stroke-linecap="round"/>
      <path d="M20,0 Q30,10 20,20 Q10,30 20,40" fill="none" stroke="#F0A500" stroke-width="4" stroke-linecap="round"/>
      <path d="M36,0 Q46,10 36,20 Q26,30 36,40" fill="none" stroke="#F0A500" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <g transform="translate(668,880) rotate(6)">
    <path d="M0,0 L44,0 C50,0 54,4 54,10 L54,58 C54,64 50,68 44,68 L14,68 L0,44 Z" fill="#F7F5F0" stroke="#26292C" stroke-width="2.5"/>
    <circle cx="27" cy="14" r="5" fill="#F7F5F0" stroke="#26292C" stroke-width="2.5"/>
    <text x="27" y="46" font-family="'Space Mono', monospace" font-size="12" fill="#E8720F" text-anchor="middle" font-weight="700">TH</text>
  </g>

  <g fill="#26292C" opacity="0.12">
    <circle cx="90" cy="120" r="2"/>
    <circle cx="700" cy="900" r="2"/>
    <circle cx="620" cy="200" r="2"/>
  </g>
</svg>
