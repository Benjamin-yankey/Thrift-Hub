<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of charcoal cargo pants with a teal knee patch and gold stitching">
  <defs>
    <pattern id="weave-cargo" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#26292C" stroke-opacity="0.045" stroke-width="1.4"/>
    </pattern>
    <pattern id="halftone-cargo" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="6.5" cy="6.5" r="2.3" fill="#F0A500" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="#F7F5F0"/>
  <rect width="800" height="1000" fill="url(#weave-cargo)"/>
  <g transform="translate(600,700)"><rect width="170" height="170" fill="url(#halftone-cargo)"/></g>

  <g transform="translate(210,120)">
    <rect x="10" y="0" width="360" height="56" rx="10" fill="#3D4147"/>
    <path d="M10,48 L-24,760 L150,760 L172,240 L198,240 L220,760 L364,760 L340,48 Z" fill="#4B5058"/>
    <line x1="20" y1="76" x2="-14" y2="740" stroke="#F0A500" stroke-width="3" stroke-dasharray="8 7" opacity="0.7"/>
    <line x1="330" y1="76" x2="354" y2="740" stroke="#F0A500" stroke-width="3" stroke-dasharray="8 7" opacity="0.7"/>

    <!-- cargo pockets -->
    <rect x="-6" y="330" width="80" height="110" rx="6" fill="#3D4147"/>
    <rect x="-6" y="330" width="80" height="14" fill="#26292C"/>
    <rect x="296" y="330" width="80" height="110" rx="6" fill="#3D4147"/>
    <rect x="296" y="330" width="80" height="14" fill="#26292C"/>
    <circle cx="34" cy="400" r="5" fill="#F0A500"/>
    <circle cx="336" cy="400" r="5" fill="#F0A500"/>

    <!-- reinforced knee patch, visible on purpose -->
    <rect x="30" y="480" width="100" height="120" rx="10" fill="#17A184"/>
    <path d="M40,490 L120,490 M40,510 L120,510 M40,530 L120,530 M40,550 L120,550 M40,570 L120,570 M40,590 L120,590" stroke="#0D7C68" stroke-width="2" opacity="0.6"/>

    <!-- waistband loops -->
    <rect x="60" y="-8" width="14" height="20" rx="3" fill="#26292C"/>
    <rect x="316" y="-8" width="14" height="20" rx="3" fill="#26292C"/>
  </g>

  <g transform="translate(668,120) rotate(-10)">
    <path d="M0,0 L44,0 C50,0 54,4 54,10 L54,58 C54,64 50,68 44,68 L14,68 L0,44 Z" fill="#F7F5F0" stroke="#26292C" stroke-width="2.5"/>
    <circle cx="27" cy="14" r="5" fill="#F7F5F0" stroke="#26292C" stroke-width="2.5"/>
    <text x="27" y="46" font-family="'Space Mono', monospace" font-size="12" fill="#17A184" text-anchor="middle" font-weight="700">TH</text>
  </g>

  <g fill="#26292C" opacity="0.12">
    <circle cx="90" cy="900" r="2"/>
    <circle cx="700" cy="500" r="2"/>
    <circle cx="120" cy="200" r="2"/>
  </g>
</svg>
